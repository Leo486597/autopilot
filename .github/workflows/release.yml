# Publish a release when a vX.Y.Z tag is pushed: notes from the merged PRs, and the vX tag moved to it, so every
# project calling @vX runs the new version on its next run.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2   # the job's own token may not move a tag past commits that edit workflows
        id: app
        with: { app-id: "${{ vars.AGENT_APP_ID }}", private-key: "${{ secrets.AGENT_APP_KEY }}" }
      - uses: actions/checkout@v4
        with: { token: "${{ steps.app.outputs.token }}" }
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          git tag -f "${TAG%%.*}" HEAD
          git push -f origin "${TAG%%.*}"
