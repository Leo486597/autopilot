# The classifier, the dispatcher and the daily sweep: https://github.com/Leo486597/autopilot
name: triage
on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [main]       # BASE in .github/autopilot.env
  schedule:
    - cron: "0 0 * * *"    # the daily sweep, in UTC
  workflow_run:
    workflows: [claude]
    types: [completed]     # a worker finishing frees a slot
  workflow_dispatch:
    inputs:
      issue:
        description: "issue to classify; empty runs the daily sweep"
        required: false
permissions:
  contents: read
  actions: read
jobs:
  autopilot:
    uses: Leo486597/autopilot/.github/workflows/triage.yml@v1
    with:
      bot: your-agent      # your GitHub App's slug
      app-id: ${{ vars.AGENT_APP_ID }}
      issue: ${{ inputs.issue }}
    secrets:
      AGENT_APP_KEY: ${{ secrets.AGENT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
