# The worker: a comment starting `@claude` starts a Claude Code session on that issue or PR: https://github.com/Leo486597/autopilot
name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
jobs:
  autopilot:
    uses: Leo486597/autopilot/.github/workflows/worker.yml@v1
    with:
      bot: your-agent
      app-id: ${{ vars.AGENT_APP_ID }}
    secrets:
      AGENT_APP_KEY: ${{ secrets.AGENT_APP_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
